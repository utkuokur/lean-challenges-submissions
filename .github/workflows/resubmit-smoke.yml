name: One-time smoke-test resubmission

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resubmit-smoke.yml"

permissions:
  contents: read
  issues: write

jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the designated private smoke-test submission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/9" --jq .body)
          jq -n --arg issue_body "$ISSUE_BODY" \
            '{event_type: "smoke-resubmit", client_payload: {issue_number: 9, issue_body: $issue_body}}' \
            > /tmp/smoke-dispatch.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/smoke-dispatch.json
