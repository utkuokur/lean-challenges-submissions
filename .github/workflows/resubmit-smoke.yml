name: One-time smoke-test resubmission

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resubmit-smoke.yml"

permissions:
  contents: read
  issues: write

jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Reopen the designated private smoke-test submission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue reopen 9 --repo "${{ github.repository }}"
